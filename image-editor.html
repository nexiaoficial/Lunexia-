<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lunexia Design Studio</title>
  <style>
    :root{--bg:#0b1020;--panel:#111827;--panel2:#172036;--line:rgba(148,163,184,.2);--ink:#eef4ff;--muted:#9aaac3;--brand:#7c6cff;--brand2:#c7a6ff;--brand3:#8e7dff}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(135deg,#0b1020,#111827);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;min-height:100vh}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .studio{display:grid;grid-template-columns:280px 1fr 320px;min-height:100vh;gap:0}
    .panel{background:rgba(15,23,42,.9);border-right:1px solid var(--line);padding:22px 18px}
    .left{padding:18px 14px}
    .right{padding:18px 18px;border-left:1px solid var(--line);border-right:none}
    .brand{display:flex;align-items:center;gap:14px;margin:8px 10px 18px;padding:6px 0;max-width:100%}
    .brand-mark{width:72px;flex:none;filter:drop-shadow(0 0 18px rgba(163,147,255,.22))}
    .brand svg{display:block;width:100%;height:auto;overflow:visible}
    .brand-copy{display:flex;flex-direction:column;gap:4px;min-width:0}
    .brand-wordmark{font-size:2rem;font-weight:800;letter-spacing:-.08em;line-height:1;color:#f5f3ff}
    .brand-tag{font-size:.72rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:#cabdff;line-height:1.2}
    .orbit-ring{fill:none;stroke:rgba(199,166,255,.65);stroke-width:2.2;stroke-dasharray:6 7}
    .moon-core{filter:drop-shadow(0 0 14px rgba(199,166,255,.55))}
    .moon-shape{fill:#a78bff;stroke:#f0e4ff;stroke-width:1.4;stroke-linejoin:round}
    .moon-highlight{fill:#dbc3ff;opacity:.78}
    .moon-halo{animation:brandHalo 4.8s ease-in-out infinite}
    .orbit-nodes{animation:brandOrbit 18s linear infinite;transform-origin:70px 70px;transform-box:fill-box}
    .orbit-node{filter:drop-shadow(0 0 8px rgba(199,166,255,.28))}
    .orbit-star .spark{animation:brandPulse 3s ease-in-out infinite}
    .orbit-image .frame{fill:rgba(255,255,255,.08);stroke:rgba(241,232,255,.7);stroke-width:1.6}
    .orbit-image .sun{fill:#f4c6ff}
    .orbit-image .mountain-a{fill:#c7a6ff}
    .orbit-image .mountain-b{fill:#8e7dff}
    .orbit-text .bubble{fill:rgba(255,255,255,.08);stroke:rgba(241,232,255,.72);stroke-width:1.6}
    .orbit-text .line{stroke:#efe8ff;stroke-width:2;stroke-linecap:round}
    .section{margin-bottom:18px}
    .section h3{margin:0 0 10px;font-size:.9rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .templates,.tool-list{display:grid;gap:10px}
    .template,.tool{display:flex;align-items:center;gap:10px;width:100%;background:rgba(17,24,39,.8);border:1px solid var(--line);color:var(--ink);border-radius:14px;padding:12px 12px;text-align:left;transition:.2s ease}
    .template:hover,.tool:hover,.swatch:hover,.action:hover{transform:translateY(-1px);border-color:rgba(124,108,255,.45)}
    .template strong{font-size:1rem}
    .work{padding:22px 18px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}
    .top h1{margin:0;font-size:2rem;letter-spacing:-.06em}
    .muted{color:var(--muted)}
    .actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .secondary,.export{border:1px solid var(--line);background:rgba(17,24,39,.8);color:var(--ink);border-radius:12px;padding:10px 14px}
    .secondary{min-width:110px}
    .stage{background:rgba(11,16,32,.8);border:1px solid var(--line);border-radius:24px;padding:14px;min-height:72vh}
    .canvas-wrap{display:grid;place-items:center;background:linear-gradient(180deg,rgba(15,23,42,.6),rgba(15,23,42,.4));border-radius:18px;min-height:68vh;padding:12px}
    .canvas{position:relative;width:min(100%,900px);aspect-ratio:1.6/1;background:#fff;border-radius:18px;overflow:hidden;border:1px solid rgba(148,163,184,.25);box-shadow:0 30px 50px rgba(2,6,23,.45)}
    .element{position:absolute;display:flex;align-items:center;justify-content:center;padding:8px 12px;border-radius:12px;user-select:none;touch-action:none;min-width:40px;min-height:40px}
    .element.text-element{font-weight:700;line-height:1.05;white-space:pre-wrap;outline:none;cursor:text}
    .element.shape{background:linear-gradient(135deg,#7c6cff,#a393ff);min-width:160px;min-height:120px;border-radius:22px;box-shadow:0 15px 30px rgba(124,108,255,.35)}
    .element.selected{outline:2px solid #a393ff;box-shadow:0 0 0 4px rgba(163,147,255,.18)}
    .element img{display:block;max-width:100%;max-height:100%;object-fit:cover;border-radius:12px}
    .field{margin-bottom:16px}
    .field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:8px}
    .field select,.field input[type="color"]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0f172a;color:var(--ink)}
    .field input[type="range"]{width:100%}
    .swatches{display:flex;gap:8px;flex-wrap:wrap}
    .swatch{width:32px;height:32px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
    .swatch.active{border-color:var(--brand2);box-shadow:0 0 0 2px rgba(163,147,255,.5),inset 0 0 0 1px rgba(255,255,255,.25)}
    .export{width:100%;padding:12px 14px;background:linear-gradient(135deg,var(--brand),var(--brand2));border:none;color:#fff;font-weight:700;border-radius:12px}
    .mini-user{display:flex;align-items:center;gap:10px}
    .avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#7c6cff,#a393ff);color:#fff;font-weight:700}
    #accountButton{min-width:160px}
    .hint{margin-top:12px;color:var(--muted);font-size:.82rem;line-height:1.5;border-top:1px solid var(--line);padding-top:14px}
    #imageInput{display:none}
    .toast{position:fixed;right:18px;bottom:18px;background:rgba(2,6,23,.92);color:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
    .toast.show{opacity:1;transform:translateY(0)}
    @keyframes brandOrbit{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
    @keyframes brandPulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.08);opacity:1}}
    @keyframes brandHalo{0%,100%{opacity:.32;transform:scale(1)}50%{opacity:.48;transform:scale(1.06)}}
    @media (max-width:980px){
      .studio{grid-template-columns:1fr}
      .panel,.right{border:none;border-bottom:1px solid var(--line)}
      .canvas{width:100%;aspect-ratio:1/1.2}
      .top{flex-direction:column;align-items:flex-start}
      .actions{width:100%}
    }
    @media (max-width:560px){
      .brand{gap:12px}
      .brand-mark{width:64px}
      .brand-wordmark{font-size:1.72rem}
      .brand-tag{font-size:.66rem;letter-spacing:.14em}
    }
    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto}
      .moon-halo,.orbit-nodes,.orbit-star .spark{animation:none}
    }
  </style>
</head>
<body>
  <div class="studio">
    <aside class="left panel">
      <div class="brand">
        <span class="brand-mark">
          <svg viewBox="0 0 140 140" role="img" aria-label="Símbolo lunar da Lunexia com elementos criativos em órbita" focusable="false">
            <circle class="moon-halo" cx="61" cy="69" r="41" fill="rgba(199,166,255,.35)"></circle>
            <ellipse class="orbit-ring" cx="70" cy="70" rx="50" ry="38" transform="rotate(-18 70 70)"></ellipse>
            <g class="moon-core">
              <path class="moon-shape" fill-rule="evenodd" d="M61 38a31 31 0 1 0 0 62a31 31 0 1 0 0-62M77 33a27 27 0 1 1 0 54a27 27 0 1 1 0-54"></path>
              <path class="moon-highlight" fill-rule="evenodd" d="M57 43a24 24 0 1 0 0 48a24 24 0 1 0 0-48M69 40a20 20 0 1 1 0 40a20 20 0 1 1 0-40"></path>
            </g>
            <g class="orbit-nodes">
              <g class="orbit-node orbit-star" transform="translate(103 33)">
                <path class="spark" d="M8 0l2.2 5.6L16 8l-5.8 2.4L8 16l-2.2-5.6L0 8l5.8-2.4L8 0z" fill="#f8ecff"></path>
              </g>
              <g class="orbit-node orbit-text" transform="translate(94 89)">
                <rect class="bubble" x="0" y="0" width="22" height="16" rx="6"></rect>
                <path class="line" d="M6 6h10M6 10h7"></path>
              </g>
              <g class="orbit-node orbit-image" transform="translate(19 85)">
                <rect class="frame" x="0" y="0" width="24" height="18" rx="5"></rect>
                <circle class="sun" cx="18" cy="5" r="2.2"></circle>
                <path class="mountain-a" d="M4 14l5-5 4 4 3-3 4 4z"></path>
                <path class="mountain-b" d="M4 14l4-4 3 3 2-2 5 3z"></path>
              </g>
            </g>
          </svg>
        </span>
        <span class="brand-copy">
          <span class="brand-wordmark">Lunexia</span>
          <span class="brand-tag">Criação em órbita</span>
        </span>
      </div>
      <div class="section"><h3>Modelos</h3><div class="templates">
        <button class="template" data-template="post">📱<strong>Post</strong></button>
        <button class="template" data-template="story">📲<strong>Story</strong></button>
        <button class="template" data-template="presentation">🖥️<strong>Apresentação</strong></button>
        <button class="template" data-template="flyer">📰<strong>Flyer</strong></button>
      </div></div>
      <div class="section"><h3>Elementos</h3><div class="tool-list">
        <button class="tool" id="addText">T&nbsp; Adicionar texto</button>
        <button class="tool" id="addShape">⬡ Adicionar forma</button>
        <button class="tool" id="uploadButton">🖼️ Enviar imagem</button>
        <button class="tool" id="removeElement">🗑️ Remover selecionado</button>
      </div></div>
      <div class="hint">Dica: selecione um elemento e arraste para reposicionar. No celular, toque para selecionar e use os controles à direita.</div>
      <input id="imageInput" type="file" accept="image/*">
    </aside>

    <main class="work">
      <header class="top"><div><h1>Lunexia Imagens</h1><span class="muted">Crie imagens para suas campanhas e materiais</span></div><div class="actions">
        <div class="mini-user" aria-label="Perfil do usuário">
          <span id="userAvatar" class="avatar">U</span>
          <button id="accountButton" class="secondary" type="button">Conta e segurança</button>
        </div>
        <button class="secondary" id="clearCanvas">Limpar</button>
        <button class="secondary" id="saveProjectBtn">Salvar</button>
      </div></header>
      <section class="stage"><div class="canvas-wrap"><div class="canvas" id="canvas"></div></div></section>
    </main>

    <aside class="right panel"><h2>Propriedades</h2><p class="muted">Personalize o elemento selecionado.</p>
      <div class="field"><label for="canvasSize">Formato</label><select id="canvasSize"><option value="post">Post 1.6:1</option><option value="square">Quadrado 1:1</option><option value="story">Story 9:16</option><option value="presentation">Apresentação 16:9</option></select></div>
      <div class="field"><label>Fundo</label><div class="swatches"><button class="swatch active" style="background:#ffffff" data-color="#ffffff"></button><button class="swatch" style="background:#111827" data-color="#111827"></button><button class="swatch" style="background:#7c6cff" data-color="#7c6cff"></button><button class="swatch" style="background:#f97316" data-color="#f97316"></button><button class="swatch" style="background:#10b981" data-color="#10b981"></button></div></div>
      <div class="field"><label for="textColor">Cor do texto</label><input id="textColor" type="color" value="#161b2b"></div>
      <div class="field"><label for="fontSize">Tamanho do texto</label><input id="fontSize" type="range" min="14" max="100" value="38"></div>
      <div class="field"><label for="elementOpacity">Opacidade</label><input id="elementOpacity" type="range" min="0.1" max="1" step="0.05" value="1"></div>
      <button class="export" id="downloadJson">💾 Salvar projeto</button>
    </aside>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script>
    const canvas=document.getElementById('canvas');let selected=null;let drag=null;
    const templates={post:{ratio:'post',bg:'#ffffff',items:[['Lunexia Design',30,35,'#161b2b',38]]},story:{ratio:'story',bg:'#7c6cff',items:[['Sua história começa aqui',12,35,'#ffffff',30]]},presentation:{ratio:'presentation',bg:'#f8fafc',items:[['Apresentação Lunexia',18,28,'#111827',34]]},flyer:{ratio:'post',bg:'#fff7ed',items:[['Oferta especial',20,20,'#111827',28]]}};

    function parseFloatValue(value, fallback=0){const num=Number.parseFloat(value);return Number.isFinite(num)?num:fallback;}
    function select(el){if(selected)selected.classList.remove('selected');selected=el;if(selected)selected.classList.add('selected');syncControls()}
    function addText(text='Novo título',x=12,y=12,color='#161b2b',size=38){
      const el=document.createElement('div');
      el.className='element text-element';
      el.contentEditable=true;
      el.textContent=text;
      el.style.left=x+'%';
      el.style.top=y+'%';
      el.style.color=color;
      el.style.fontSize=size+'px';
      el.style.opacity='1';
      el.addEventListener('click',e=>{e.stopPropagation();select(el)});
      el.addEventListener('focus',()=>select(el));
      el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();el.blur()}});
      canvas.appendChild(el);
      makeDraggable(el);
      select(el);
      el.focus();
      return el;
    }
    function addShape(){const el=document.createElement('div');el.className='element shape';el.style.left='15%';el.style.top='55%';el.style.opacity='1';el.addEventListener('click',e=>{e.stopPropagation();select(el)});canvas.appendChild(el);makeDraggable(el);select(el);return el;}
    function makeDraggable(el){
      el.addEventListener('pointerdown',e=>{
        if(e.target.isContentEditable&&document.activeElement===el)return;
        select(el);
        drag={el,startX:e.clientX,startY:e.clientY,left:parseFloatValue(el.style.left,0),top:parseFloatValue(el.style.top,0)};
        el.setPointerCapture?.(e.pointerId);
      });
      el.addEventListener('pointermove',e=>{
        if(!drag||drag.el!==el)return;
        const rect=canvas.getBoundingClientRect();
        const dx=(e.clientX-drag.startX)/rect.width*100;
        const dy=(e.clientY-drag.startY)/rect.height*100;
        el.style.left=(drag.left+dx)+'%';
        el.style.top=(drag.top+dy)+'%';
      });
      el.addEventListener('pointerup',()=>drag=null);
      el.addEventListener('pointerleave',()=>drag=null);
    }
    function syncControls(){
      if(!selected){
        document.getElementById('elementOpacity').value=1;
        return;
      }
      const style=getComputedStyle(selected);
      document.getElementById('elementOpacity').value=style.opacity||1;
      if(selected.classList.contains('text-element')){
        const color=style.color||'#161b2b';
        document.getElementById('textColor').value=rgbToHex(color);
        document.getElementById('fontSize').value=Math.round(parseFloat(style.fontSize)||38);
      }
    }
    function rgbToHex(rgb){const m=rgb.match(/\d+/g);return m?'#'+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join(''):'#161b2b'}
    function loadTemplate(name){const t=templates[name];if(!t)return;canvas.dataset.ratio=t.ratio;canvas.style.background=t.bg;canvas.innerHTML='';t.items.forEach(i=>addText(...i));select(null)}
    document.querySelectorAll('.template').forEach(b=>b.onclick=()=>loadTemplate(b.dataset.template));
    document.getElementById('addText').onclick=()=>addText();
    document.getElementById('addShape').onclick=()=>addShape();
    document.getElementById('clearCanvas').onclick=()=>{canvas.innerHTML='';select(null);} ;
    document.getElementById('uploadButton').onclick=()=>document.getElementById('imageInput').click();
    document.getElementById('imageInput').onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=document.createElement('img');img.className='element';img.src=reader.result;img.style.left='30%';img.style.top='18%';img.style.width='40%';img.style.height='45%';img.style.objectFit='cover';img.style.borderRadius='16px';img.addEventListener('click',ev=>{ev.stopPropagation();select(img)});canvas.appendChild(img);makeDraggable(img);select(img)};reader.readAsDataURL(file)};
    document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{canvas.style.background=b.dataset.color;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x===b));});
    document.getElementById('canvasSize').onchange=e=>{
      const map={post:'1.6 / 1',square:'1 / 1',story:'9 / 16',presentation:'16 / 9'};
      canvas.style.aspectRatio=map[e.target.value]||'1.6 / 1';
    };
    document.getElementById('textColor').oninput=e=>{if(selected && selected.classList.contains('text-element'))selected.style.color=e.target.value;};
    document.getElementById('fontSize').oninput=e=>{if(selected && selected.classList.contains('text-element'))selected.style.fontSize=e.target.value+'px';};
    document.getElementById('elementOpacity').oninput=e=>{if(selected)selected.style.opacity=e.target.value;};
    function saveJson(){const data={ratio:canvas.dataset.ratio||'post',bg:canvas.style.background,html:canvas.innerHTML};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='lunexia-projeto.json';a.click();URL.revokeObjectURL(a.href);showToast('Projeto salvo com sucesso.');}
    document.getElementById('downloadJson').onclick=saveJson;
    document.getElementById('saveProjectBtn').onclick=saveJson;
    canvas.onclick=()=>select(null);
    function showToast(msg){const toast=document.getElementById('toast');toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),2200);}

    const auth = window.LunexiaAuth;
    if (auth && typeof auth.launchProtectedExperience === 'function') {
      auth.launchProtectedExperience('app.html');
    }
    if (auth && typeof auth.requireAuth === 'function') {
      auth.requireAuth({ redirectTo: 'app.html' });
    }

    const title = document.querySelector('.top h1');
    const avatar = document.getElementById('userAvatar');
    const accountButton = document.getElementById('accountButton');
    const state = auth && typeof auth.getState === 'function' ? auth.getState() : { authenticated: false };
    const userName = localStorage.getItem('userName') || 'Usuário';
    const initial = (userName || 'U').trim().charAt(0).toUpperCase();
    if (title) title.textContent = `Olá, ${userName}! 👋`;
    if (avatar) avatar.textContent = initial;
    if (accountButton) accountButton.textContent = state.authenticated ? 'Conta protegida' : 'Conta e segurança';

    loadTemplate('post');
  </script>
</body>
</html>
